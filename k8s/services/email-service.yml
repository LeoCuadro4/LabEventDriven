apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: microservices
  labels:
    app: email-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      containers:
        - name: email-service
          image: email-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3007
          env:
            - name: KAFKA_BROKER
              value: "kafka:29092"
            - name: SERVICE_NAME
              value: "email-service"
            - name: EMAIL_USER
              value: "sheila.valencia@correounivalle.edu.co"     
            - name: EMAIL_PASS
              value: "pnoz fnzp xutc srbl"             
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: microservices
spec:
  selector:
    app: email-service
  ports:
    - protocol: TCP
      port: 3007       
      targetPort: 3007  
  type: ClusterIP
